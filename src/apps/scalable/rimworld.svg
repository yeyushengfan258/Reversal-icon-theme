<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" version="1.1" viewBox="0 0 64 64">
 <defs>
  <filter id="tile-shadow" x="-.05" y="-.05" width="1.1" height="1.1" color-interpolation-filters="sRGB">
   <feGaussianBlur stdDeviation=".61875"/>
  </filter>
  <filter id="mark-shadow" x="-.12" y="-.12" width="1.24" height="1.3" color-interpolation-filters="sRGB">
   <feGaussianBlur in="SourceAlpha" stdDeviation="1.15" result="blur"/>
