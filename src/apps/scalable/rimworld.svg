  </linearGradient>
  <linearGradient id="mark-fill" x1="32" x2="32" y1="51" y2="13" gradientUnits="userSpaceOnUse">
   <stop stop-color="#d8d8d8" offset="0"/>
   <stop stop-color="#fff" offset="1"/>
  </linearGradient>
 </defs>
 <rect x="4.5" y="4.5" width="55" height="55" ry="15" fill="#141414" filter="url(#tile-shadow)" opacity=".3"/>
 <rect x="4.5" y="4.5" width="55" height="55" ry="15" fill="url(#tile-fill)"/>
